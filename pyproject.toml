[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ravlator"
version = "0.1.0"
description = "Next-Generation Windows Gaming & Wine Prefix Manager for macOS"
readme = "docs/SRS_Documentation.md"
requires-python = ">=3.12"
license = {text = "MIT"}
authors = [
    {name = "Ravlator Core Contributors"}
]
dependencies = [
    "PySide6>=6.7.0",
    "pydantic>=2.7.0",
    "pyyaml>=6.0.1",
    "aiohttp>=3.9.0",
    "pefile>=2023.2.7",
    "pillow>=10.3.0",
]

[project.scripts]
ravlator = "ravlator.gui.app:main"
ravlator-cli = "ravlator.cli.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["ravlator*"]
exclude = ["tests*", "docs*"]
